[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
set_env =
    PYTHONPATH = :{[vars]src_path}
    PY_COLORS = 1
allowlist_externals =
    poetry


[testenv:format]
description = Apply coding style standards to code
commands_pre =
    poetry install --only format
commands =
    poetry lock
    poetry run isort {[vars]all_path}
    poetry run black {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
allowlist_externals =
    {[testenv]allowlist_externals}
    find
commands_pre =
    poetry install --only lint
commands =
    poetry check --lock
    poetry run codespell {[vars]all_path} --skip {[vars]src_path}/grafana_dashboards/*.json --skip {[vars]tests_path}/**/data_interfaces.py
    poetry run pflake8 --exclude '.git,__pycache__,.tox,build,dist,*.egg_info,venv,tests/integration/relation_tests/application-charm/lib/charms/data_platform_libs/,tests/integration/ha_tests/application_charm/lib/charms/data_platform_libs/' {[vars]all_path}
    poetry run isort --check-only --diff {[vars]all_path}
    poetry run black --check --diff {[vars]all_path}
    find {[vars]all_path} -type f \( -name "*.sh" -o -name "*.bash" \) -exec poetry run shellcheck --color=always \{\} +

[testenv:integration]
description = Run integration tests
pass_env =
    CI
    GITHUB_OUTPUT
    SECRETS_FROM_GITHUB
commands_pre =
    poetry install --only integration
commands =
    poetry run pytest -v --tb native --log-cli-level=INFO -s --ignore={[vars]tests_path}/unit/ {posargs}

[testenv:terraform-lint]
description = Format and validate Terraform modules
allowlist_externals =
    {[testenv]allowlist_externals}
    terraform
commands =
    terraform -chdir="{tox_root}/terraform/charms/mongodb" init
    terraform -chdir="{tox_root}/terraform/charms/mongodb" fmt -check
    terraform -chdir="{tox_root}/terraform/charms/mongodb" validate
    terraform -chdir="{tox_root}/terraform/components/config_and_routing" init
    terraform -chdir="{tox_root}/terraform/components/config_and_routing" fmt -check
    terraform -chdir="{tox_root}/terraform/components/config_and_routing" validate
    terraform -chdir="{tox_root}/terraform/product/replica_set" init
    terraform -chdir="{tox_root}/terraform/product/replica_set" fmt -check
    terraform -chdir="{tox_root}/terraform/product/replica_set" validate
    terraform -chdir="{tox_root}/terraform/product/sharded_cluster" init
    terraform -chdir="{tox_root}/terraform/product/sharded_cluster" fmt -check
    terraform -chdir="{tox_root}/terraform/product/sharded_cluster" validate