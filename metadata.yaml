name: mongodb-k8s
display-name: |
  Charmed Operator for MongoDB
description: |
  MongoDB is a general purpose distributed document database.  This
  charm deploys and operates MongoDB on kubernetes Clusters. It
  supports replicated MongoDB databases.
summary: A MongoDB operator charm for Kubernetes
docs: https://discourse.charmhub.io/t/charmed-mongodb-6-k8s-docs/10265
source: https://github.com/canonical/mongodb-k8s-operator
issues: https://github.com/canonical/mongodb-k8s-operator/issues
website:
  - https://ubuntu.com/data/mongodb
  - https://charmhub.io/mongodb-k8s
  - https://github.com/canonical/mongodb-k8s-operator
  - https://chat.charmhub.io/charmhub/channels/data-platform

peers:
  database-peers:
    interface: mongodb-peers
  upgrade-version-a:
    interface: upgrade
  ldap-peers:
    # Stores the data for the ldap relation.
    interface: ldap-peers
  status-peers:
    interface: status-peers

provides:
  database:
    interface: mongodb_client
    optional: true
  obsolete:
    interface: mongodb
    optional: true
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
  config-server:
    interface: shards
    optional: true
  cluster:
    interface: config-server
    optional: true

requires:
  certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    limit: 1
    optional: true
  s3-credentials:
    interface: s3
    optional: true
  sharding:
    interface: shards
    # shards can only relate to one config-server
    limit: 1
    optional: true
  ldap:
    interface: ldap
    limit: 1
    optional: true
  ldap-certificate-transfer:
    interface: certificate_transfer
    limit: 1
    optional: true

containers:
  mongod:
    resource: mongodb-image
    mounts:
      - storage: mongodb
        location: /var/lib/mongodb
resources:
  mongodb-image:
    type: oci-image
    description: OCI image for mongodb
    # TODO: Update sha whenever upstream rock changes
    upstream-source: ghcr.io/canonical/charmed-mongodb@sha256:3e2710bfc3c7c14e959fae8d8be7e037d6457e755d31f6af5ec3e3821f3ea3c6
storage:
  mongodb:
    type: filesystem
    location: /var/lib/mongodb
  mongodb-logs:
    type: filesystem
    location: /var/log/mongodb
