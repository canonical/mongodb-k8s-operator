name: mongodb-k8s
display-name: |
  Charmed Operator for MongoDB
description: |
  MongoDB is a general purpose distributed document database.  This
  charm deploys and operates MongoDB on kubernetes Clusters. It
  supports replicated MongoDB databases.
summary: A MongoDB operator charm for Kubernetes
docs: https://canonical-charmed-mongodb.readthedocs-hosted.com/8/
source: https://github.com/canonical/mongodb-k8s-operator
issues: https://github.com/canonical/mongodb-k8s-operator/issues
website:
  - https://ubuntu.com/data/mongodb
  - https://charmhub.io/mongodb-k8s
  - https://github.com/canonical/mongodb-k8s-operator
  - https://chat.charmhub.io/charmhub/channels/data-platform

peers:
  database-peers:
    interface: mongodb-peers
  ldap-peers:
    # Stores the data for the ldap relation.
    interface: ldap-peers
  status-peers:
    interface: status-peers
  refresh-v-three:
    # Relation versioning scheme: https://canonical-charm-refresh.readthedocs-hosted.com/latest/
    interface: refresh
  rollingops-peers:
    interface: rollingops-peers

provides:
  database:
    interface: mongodb_client
    optional: true
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
  config-server:
    interface: shards
    optional: true
  cluster:
    interface: config-server
    optional: true

requires:
  peer-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  client-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    limit: 1
    optional: true
  s3-credentials:
    interface: s3
    optional: true
  gcs-credentials:
    interface: gcs
    limit: 1
  sharding:
    interface: shards
    # shards can only relate to one config-server
    limit: 1
    optional: true
  ldap:
    interface: ldap
    limit: 1
    optional: true
  ldap-certificate-transfer:
    interface: certificate_transfer
    limit: 1
    optional: true
  vault-kv:
    interface: vault-kv
    optional: true
    limit: 1

containers:
  mongod:
    resource: mongodb-image
    mounts:
      - storage: archive
        location: /var/common/mongodb/archive
      - storage: data
        location: /var/lib/mongodb
      - storage: logs
        location: /var/log/mongodb
      - storage: temp
        location: /tmp
resources:
  mongodb-image:
    type: oci-image
    description: OCI image for mongodb
    # TODO: Update sha whenever upstream rock changes
    upstream-source: ghcr.io/canonical/charmed-mongodb@sha256:f9dff72533f5b2a8fa54784b94e06adbf1eec77dd0a37b97ad5250af46104e7f
storage:
  archive:
    type: filesystem
    location: /var/common/mongodb/archive
    description: storage for local backup files.
  data:
    type: filesystem
    location: /var/lib/mongodb
    description: storage for MongoDB data.
  logs:
    type: filesystem
    location: /var/log/mongodb
    description: storage for logfiles.
  temp:
    type: filesystem
    location: /tmp
    description: Storage mount used for storing temporary tablespaces.
