name: Release to 8-transition/edge

on:
  push:
    branches:
      - 8-transition/edge

jobs:
  ci-tests:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: write # Needed to create git tag
    cache-mode: none

  release:
    name: Release charm
    needs:
      - ci-tests
    uses: canonical/data-platform-workflows/.github/workflows/release_charm_edge.yaml@v56.0.0
    with:
      track: 8-transition
      artifact-prefix: ${{ needs.ci-tests.outputs.artifact-prefix }}
    secrets:
      charmhub-token: ${{ secrets.CHARMHUB_TOKEN_EDGE }}
    permissions:
      contents: write # Needed to create git tags
    cache-mode: none
