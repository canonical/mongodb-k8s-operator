name: Tests

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

jobs:
  lint-workflows:
    name: Lint .github/workflows
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v49.0.0
    permissions:
      contents: read

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: tox run -e lint
        run: tox run -e lint
    permissions: {}

  terraform-lint:
    name: Terraform - Lint / format / validate modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install terraform snap
        run: |
          sudo snap install terraform --channel=latest/stable --classic

      - name: Install tox
        run: pipx install tox

      - name: Lint / format / validate TF modules
        run: tox run -e terraform-lint

  terraform-product-test:
    name: Terraform - ${{ matrix.product_module }} product module
    strategy:
      fail-fast: false
      matrix:
        include:
          - product_module: replica-set
            apply_script: .github/scripts/terraform-apply-replica-set.sh
          - product_module: sharded-cluster
            apply_script: .github/scripts/terraform-apply-sharded.sh
    needs:
      - terraform-lint
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (GitHub hosted) Free up disk space
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -r /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable

      - name: (self hosted) Disk usage
        run: df --human-readable

      - name: Install terraform snap
        run: |
          sudo snap install terraform --channel=latest/stable --classic

      - name: Install Juju
        run: |
          sudo snap install juju --channel=3.6

      - name: microk8s setup
        run: |
          sudo snap install microk8s --channel=1.35-strict/stable
          sudo usermod -a -G snap_microk8s "$(whoami)"
          mkdir -p ~/.kube
          sudo chown -R "$(whoami)" ~/.kube
          newgrp snap_microk8s
          sudo microk8s enable dns storage ingress

      - name: Juju setup
        run: |
          mkdir -p ~/.local/share/juju
          sudo --user "$USER" juju bootstrap 'microk8s' --config model-logs-size=10G
          juju model-defaults logging-config='<root>=INFO; unit=DEBUG'
          juju add-model "test-${{ matrix.product_module }}"

      - name: Terraform deploy - ${{ matrix.product_module }} product module
        run: bash "${{ matrix.apply_script }}" "test-${{ matrix.product_module }}"

      - name: Wait for juju deployment
        run: |
          # TODO - remove this when juju wait-for starts reporting the up to date status
          until timeout 2m juju wait-for model "test-${{ matrix.product_module }}" --query='life=="alive" && status=="available"'
          do
            echo "Retrying in 5 seconds..."
            juju status -m "test-${{ matrix.product_module }}"
            sleep 5
          done

  build:
    name: Build charm
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v49.0.0
    with:
      cache: true
    permissions:
      actions: read
      contents: read

  integration-test:
    name: Integration test charm
    needs:
      - lint-workflows
      - lint
      - build
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      contents: read
